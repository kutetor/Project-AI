<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Planner</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="planner">
        <img src="maldiverna.jpg" alt="Beach">
        <h1>My Daily Planner</h1>
        <p>Planera dagens aktiviteter</p>
        

        <div class="task-input">
            <input 
                type="text" 
                id="taskInput" 
                placeholder="Skriv en aktivitet..."
            >

            <button id="addTaskButton">Lägg till</button>
        </div>

        <ul id="taskList"></ul>
    </main>

    <script src="script.js"></script>
</body>
</html>
